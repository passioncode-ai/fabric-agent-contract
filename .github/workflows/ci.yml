name: Contract

# The nightly batch (operator's CI policy of 2026-09-25, org-index docs/CI-BATCHING.md; applied to this
# repository by the operator's go of 2026-10-11): 23:00 Europe/Warsaw, and a manual dispatch for an urgent
# candidate, `gh workflow run ci.yml --ref <branch>`. The merge gate is `pnpm run check`, run by the merging
# session, its output in the pull request (AGENTS.md).
on:
  schedule:
    - cron: '0 21 * * *'   # 23:00 Warsaw in summer time
    - cron: '0 22 * * *'   # 23:00 Warsaw in winter time
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
