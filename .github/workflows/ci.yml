name: Contract

# The nightly batch (operator's CI policy of 2026-09-25, org-index docs/CI-BATCHING.md; applied to this
# repository by the operator's go of 2026-10-11): 23:00 Europe/Warsaw, and a manual dispatch for an urgent
# candidate, `gh workflow run ci.yml --ref <branch>`. The merge gate is `pnpm run check`, run by the merging
# session, its output in the pull request (AGENTS.md).
on:
  schedule:
    - cron: '0 21 * * *'   # 23:00 Warsaw in summer time
    - cron: '0 22 * * *'   # 23:00 Warsaw in winter time
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ matrix.os }}
    # Node 22 and 24 on Linux (the package admits `engines: >=22.13`), and Node 24 on Windows, where consumers run the
    # Windows rules (service paths, the token reader, the local channel's pipe) and the gate must pass too. Node 22
    # accepts an Ed25519 signature under a small-order key, so only it proves the small-order guard of CT-29 (DEC-0045).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history: pin:check and its test ask whether a commit is on the contract's history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gate, `pnpm run check`, one step per part so a failure in one does not hide the next.
      - run: pnpm typecheck
      # On Windows the tests that need POSIX modes, root or `:` in a file name are skipped (CT-191), so the branches they
      # reach are not covered there: the coverage floors are measured on Linux, and Windows runs the same tests without them.
      - run: pnpm ${{ runner.os == 'Windows' && 'test:fast' || 'test' }}
        if: ${{ !cancelled() }}
      - run: pnpm ux:lint
        if: ${{ !cancelled() }}
      - run: pnpm docs:check
        if: ${{ !cancelled() }}
      - run: pnpm privacy:check
        if: ${{ !cancelled() }}
